<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: #eef3f7; /* calm background */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-box {
            background: #ffffff;
            width: 360px;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #27ae60;
            margin-bottom: 15px;
        }

        p {
            color: #34495e;
            font-size: 14px;
        }

        h3 {
            color: #2c3e50;
            margin: 10px 0 15px 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="success-box">
        <h2>✅ Issue Submitted Successfully</h2>

        <p>Your reference ID is:</p>
        <h3>{{ reference_id }}</h3>

        <p>Please check your email for confirmation.</p>
    </div>

</body>
</html>
